name: Build KomeMaku

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Restore KomeMaku v1.7.0 source (one-time)
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .bootstrap/v1.7.0-payload.b64 ]]; then
            echo "restored=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base64 --decode .bootstrap/v1.7.0-payload.b64 > "$RUNNER_TEMP/komemaku-update.tar.xz"
          echo "70625c41c5fe07fc0830280610c4fb27ca33bbcbea2e9777beecd94bb5db7a46  $RUNNER_TEMP/komemaku-update.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/komemaku-update.tar.xz" -C .
          rm -rf .bootstrap
          echo "restored=true" >> "$GITHUB_OUTPUT"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Manifest V3 and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const m=require("./manifest.json"); if(m.manifest_version!==3 || m.version!=="1.7.0") process.exit(1)'
          for file in *.js tests/*.cjs; do node --check "$file"; done
      - name: Run unit and integration simulations
        shell: bash
        run: |
          set -euo pipefail
          for file in tests/*.cjs; do
            echo "::group::$file"
            node "$file"
            echo "::endgroup::"
          done
      - name: Commit verified unpacked source to main
        if: steps.restore.outputs.restored == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release KomeMaku v1.7.0: WebGL2, worker scheduler and FPS controls"
          git push origin HEAD:main
      - name: Package extension for Chrome and Edge
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p 'require("./manifest.json").version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist/KomeMaku
          cp manifest.json background.js bridge.js content.js i18n.js live-chat.js logic.js renderer-webgl.js scheduler-host.html scheduler-host.js scheduler-worker.js player.css popup.css popup.html popup.js ycs-bridge.js ycs-parser.js dist/KomeMaku/
          cp -R icons dist/KomeMaku/icons
          (cd dist && zip -q -r "KomeMaku-v${VERSION}.zip" KomeMaku)
          unzip -t "dist/KomeMaku-v${VERSION}.zip"
      - name: Upload ZIP as artifact
        uses: actions/upload-artifact@v4
        with:
          name: KomeMaku-v${{ steps.package.outputs.version }}
          path: dist/KomeMaku-v*.zip
          retention-days: 90
          if-no-files-found: error
