name: Build KomeMaku

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Restore source from temporary bootstrap (first run only)
        id: restore
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f .bootstrap/part00 ]]; then
            echo "bootstrapped=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat .bootstrap/part{00..07} | base64 -d > "$RUNNER_TEMP/KomeMaku-base.tar.xz"
          echo "f855a1e3c57707b5ce231e3385243215b7c4f250dadf5d25b0286318fc019d5d  $RUNNER_TEMP/KomeMaku-base.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/KomeMaku-base.tar.xz" -C .
          cat .bootstrap/patch{00..02} | base64 -d | xz -dc > "$RUNNER_TEMP/KomeMaku-v1.5.0.patch"
          echo "7448f29b36a91d0582b6a0ee071139082877eefa1c9c279936e590d76bc5b5d8  $RUNNER_TEMP/KomeMaku-v1.5.0.patch" | sha256sum --check
          git apply "$RUNNER_TEMP/KomeMaku-v1.5.0.patch"
          rm -rf .bootstrap
          echo "bootstrapped=true" >> "$GITHUB_OUTPUT"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Manifest V3 and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const m=require("./manifest.json"); if(m.manifest_version!==3 || m.version!=="1.5.0") process.exit(1)'
          for file in *.js tests/*.cjs; do node --check "$file"; done
      - name: Run unit and integration simulations
        shell: bash
        run: |
          set -euo pipefail
          for file in tests/*.cjs; do
            echo "::group::$file"
            node "$file"
            echo "::endgroup::"
          done
      - name: Commit unpacked source to main
        if: steps.restore.outputs.bootstrapped == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import full KomeMaku v1.5.0 source and tests"
          git push origin HEAD:main
      - name: Package extension for Chrome and Edge
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p 'require("./manifest.json").version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist/KomeMaku
          cp manifest.json background.js bridge.js content.js i18n.js live-chat.js logic.js player.css popup.css popup.html popup.js ycs-bridge.js ycs-parser.js dist/KomeMaku/
          cp -R icons dist/KomeMaku/icons
          (cd dist && zip -q -r "KomeMaku-v${VERSION}.zip" KomeMaku)
          unzip -t "dist/KomeMaku-v${VERSION}.zip"
      - name: Upload ZIP as artifact
        uses: actions/upload-artifact@v4
        with:
          name: KomeMaku-v${{ steps.package.outputs.version }}
          path: dist/KomeMaku-v*.zip
          retention-days: 90
          if-no-files-found: error