name: Build KomeMaku

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Manifest V3 and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const m=require("./manifest.json"); if(m.manifest_version!==3 || m.version!=="1.8.7") process.exit(1)'
          for file in *.js tests/*.cjs; do node --check "$file"; done
      - name: Run unit and integration simulations
        shell: bash
        run: |
          set -euo pipefail
          for file in tests/*.cjs; do
            echo "::group::$file"
            node "$file"
            echo "::endgroup::"
          done
      - name: Package extension for Chrome and Edge
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p 'require("./manifest.json").version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          mkdir -p dist/KomeMaku
          cp manifest.json background.js bridge.js content.js i18n.js settings-groups.js live-chat.js logic.js renderer-webgl.js scheduler-host.html scheduler-host.js scheduler-worker.js player.css popup.css popup.html popup.js options.css options.html options.js ycs-bridge.js ycs-parser.js dist/KomeMaku/
          cp -R icons dist/KomeMaku/icons
          (cd dist && zip -q -r "KomeMaku-v${VERSION}.zip" KomeMaku)
          unzip -t "dist/KomeMaku-v${VERSION}.zip"
      - name: Upload ZIP as artifact
        uses: actions/upload-artifact@v4
        with:
          name: KomeMaku-v${{ steps.package.outputs.version }}
          path: dist/KomeMaku-v*.zip
          retention-days: 90
          if-no-files-found: error
