name: Build KomeMaku

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Setup Python for reproducible icon generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rasterize approved mint branding
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'CairoSVG>=2.7,<3' 'Pillow>=10,<13'
          python scripts/render-icons.py
      - name: Verify Manifest V3 and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const m=require("./manifest.json"); if(m.manifest_version!==3 || m.version!=="1.9.1") process.exit(1)'
          for file in *.js tests/*.cjs; do node --check "$file"; done
      - name: Run unit and integration simulations
        shell: bash
        run: |
          set -euo pipefail
          for file in tests/*.cjs; do
            echo "::group::$file"
            node "$file"
            echo "::endgroup::"
          done
      - name: Publish updated PNG icons to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain -- icons/icon16.png icons/icon32.png icons/icon48.png icons/icon128.png)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add icons/icon16.png icons/icon32.png icons/icon48.png icons/icon128.png
            git commit -m "assets: generate v1.9.1 flowing-comment icons from SVG"
            git push origin HEAD:main
          fi
      - name: Stage extension for Chrome and Edge
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p 'require("./manifest.json").version')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          rm -rf dist
          mkdir -p dist/KomeMaku
          cp manifest.json background.js bridge.js content.js i18n.js settings-groups.js live-chat.js logic.js renderer-webgl.js scheduler-host.html scheduler-host.js scheduler-worker.js player.css popup.css popup.html popup.js options.css options.html options.js ycs-bridge.js ycs-parser.js dist/KomeMaku/
          cp -R icons dist/KomeMaku/icons
          test -f dist/KomeMaku/manifest.json
          node -e 'const m=require("./dist/KomeMaku/manifest.json"); if(m.manifest_version!==3) process.exit(1)'
          # upload-artifact already creates the downloadable ZIP. Do not nest another ZIP.
          if find dist -type f -iname '*.zip' | grep -q .; then
            echo 'Unexpected ZIP inside extension artifact' >&2
            exit 1
          fi
      - name: Upload extension folder as artifact
        uses: actions/upload-artifact@v4
        with:
          name: KomeMaku-v${{ steps.package.outputs.version }}
          path: dist/
          retention-days: 90
          if-no-files-found: error
