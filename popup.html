<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KomeMaku</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <div class="header"><span class="logo">弾</span><div><h1 data-i18n="title">KomeMaku</h1><p data-i18n="subtitle">YouTubeコメントの弾幕表示</p></div></div>
    <label class="toggleline" for="enabled"><span data-i18n="enabled">弾幕を表示</span><input type="checkbox" id="enabled"></label>
    <div class="setting-row"><label for="language" data-i18n="language">表示言語</label><select id="language"><option value="auto" data-i18n="auto">自動（ブラウザー）</option><option value="ja">日本語</option><option value="en">English</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option></select></div>
    <div class="setting"><label for="fontSize"><span data-i18n="fontSize">文字サイズ</span> <output id="fontSizeOut"></output></label><input id="fontSize" type="range" min="14" max="38" step="1"></div>
    <div class="setting"><label for="speed"><span data-i18n="speed">流れる速さ</span> <output id="speedOut"></output></label><input id="speed" type="range" min="0.5" max="2" step="0.1"></div>
    <div class="setting"><label for="density"><span data-i18n="density">表示頻度</span> <output id="densityOut"></output></label><input id="density" type="range" min="1" max="10" step="1"><p class="hint" data-i18n="densityHint">終了までに流れ切るように表示件数を調整します。</p></div>
    <div class="setting"><label for="opacity"><span data-i18n="opacity">不透明度</span> <output id="opacityOut"></output></label><input id="opacity" type="range" min="0.2" max="1" step="0.05"></div>
    <div class="setting-row"><label for="colorMode" data-i18n="colorMode">コメントの色</label><select id="colorMode"><option value="single" data-i18n="colorSingle">単色</option><option value="random" data-i18n="colorRandom">ランダム</option></select></div>
    <div class="setting-row"><label for="color" data-i18n="color">基本色</label><input type="color" id="color" value="#ffffff"></div>
    <div class="setting-row"><label for="speedMode" data-i18n="speedMode">速度の変化</label><select id="speedMode"><option value="fixed" data-i18n="speedFixed">一定</option><option value="random" data-i18n="speedRandom">ランダム</option></select></div>
    <label class="toggleline" for="hideReplies"><span data-i18n="hideReplies">返信コメントを非表示</span><input type="checkbox" id="hideReplies"></label>
    <label class="toggleline" for="preserveLineBreaks"><span data-i18n="preserveLineBreaks">コメントの改行を維持</span><input type="checkbox" id="preserveLineBreaks"></label>
    <div class="setting"><label for="hideFromLines"><span data-i18n="hideFromLines">この行数以上を非表示</span> <output id="hideFromLinesOut"></output></label><input id="hideFromLines" type="range" min="0" max="10" step="1"><p class="hint" data-i18n="lineHint">0で制限なし。改行表示OFFでも元の行数で判定します。</p></div>
    <div class="setting"><label for="featuredPercent"><span data-i18n="featuredPercent">中央に拡大表示する人気コメント</span> <output id="featuredPercentOut"></output></label><input id="featuredPercent" type="range" min="0" max="30" step="1"><p class="hint" data-i18n="featuredHint">いいね数上位の指定割合を中央に1.5倍で表示（0%で無効）。</p></div>
    <section class="import-area">
      <strong data-i18n="importTitle">YCS Continued と連携</strong>
      <p data-i18n="importDesc">YCSの「Load all」で取得したコメントを取り込みます。</p>
      <label class="filebutton" for="ycsFile" data-i18n="importButton">YCSのJSONファイルを読み込む</label>
      <input type="file" id="ycsFile" accept=".json,application/json" hidden>
      <p id="importStatus" role="status" aria-live="polite"></p>
    </section>
    <div class="status"><strong data-i18n="statusTitle">現在の動画</strong><p id="statusText" data-i18n="unavailable">YouTubeの動画ページで使用できます。</p></div>
    <p class="hint" data-i18n="hint">再生位置に同期し、いいねが少ないコメントから間引きます。</p>
  </main>
  <script src="i18n.js"></script>
  <script src="ycs-parser.js"></script>
  <script src="popup.js"></script>
</body>
</html>
