<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="KomeMaku - flowing video comments">
  <defs>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#80ffdc"/><stop offset=".56" stop-color="#2cf3ba"/><stop offset="1" stop-color="#00dcab"/></linearGradient>
    <linearGradient id="dark" x1="0" y1="0" x2=".8" y2="1"><stop offset="0" stop-color="#15505a"/><stop offset=".43" stop-color="#062e38"/><stop offset="1" stop-color="#00282f"/></linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#aeffeb"/><stop offset=".5" stop-color="#67fbd5"/><stop offset="1" stop-color="#19deb1"/></linearGradient>
    <!-- userSpaceOnUse keeps a gradient visible on perfectly horizontal strokes when rasterized with CairoSVG. -->
    <linearGradient id="textTrail" gradientUnits="userSpaceOnUse" x1="12" y1="0" x2="107" y2="0"><stop offset="0" stop-color="#f8fffd"/><stop offset=".50" stop-color="#b8ffeb"/><stop offset="1" stop-color="#22efbf"/></linearGradient>
    <linearGradient id="fadeTrail" gradientUnits="userSpaceOnUse" x1="12" y1="0" x2="107" y2="0"><stop offset="0" stop-color="#eafff9"/><stop offset=".66" stop-color="#8bf9df"/><stop offset="1" stop-color="#22efbf" stop-opacity=".35"/></linearGradient>
  </defs>
  <!-- Dark-teal and mint brand colors, shared by the settings center. -->
  <rect x="1" y="1" width="126" height="126" rx="31" fill="url(#border)"/>
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#dark)"/>
  <path d="M8 44Q9 8 43 8H63L8 68Z" fill="#84fff0" opacity=".055"/>
  <!-- Outer comments are translucent: text arrives and leaves the player. -->
  <g fill="none" stroke="url(#fadeTrail)" stroke-linecap="round" opacity=".43">
    <path d="M31 28H53" stroke-width="3.8"/>
    <path d="M18 35H44" stroke-width="4.1"/>
    <path d="M15 44H32" stroke-width="3.7"/>
    <path d="M79 106H101" stroke-width="4.1"/>
    <path d="M93 113H108" stroke-width="3.5"/>
  </g>
  <!-- Generous rounded video outline; upper right is behind the larger bubble. -->
  <path d="M70 46H46C32 46 25 54 25 66V84C25 96 33 101 46 101H87C101 101 108 94 108 82V62"
        fill="none" stroke="#f8fffd" stroke-width="8.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Visible lines of streaming comments within the player, with gradients. -->
  <g fill="none" stroke="url(#textTrail)" stroke-linecap="round">
    <path d="M37 58H61" stroke-width="5.0"/>
    <path d="M33 69H47" stroke-width="4.5"/>
    <path d="M85 73H99" stroke-width="4.6"/>
    <path d="M37 88H48" stroke-width="4.3"/>
    <path d="M66 91H94" stroke-width="4.6"/>
  </g>
  <!-- Legible play mark, slightly larger than the preceding v1.9.1 triangle. -->
  <path d="M52 58.5Q52 55.2 55.3 56.9L77.5 69Q80.5 70.7 77.4 72.4L55.4 85Q52 87 52 83.6Z" fill="#f8fffd"/>
  <!-- Oversized comment bubble with clear three-dot symbol. -->
  <path d="M82 19H96C109 19 117 28 117 40C117 52 108 60 95 60H85L69 69L75 53C69 48 66 44 66 39C66 27 73 19 82 19Z" fill="#fbfffe"/>
  <circle cx="81" cy="39" r="3.0" fill="#03323b"/><circle cx="93" cy="39" r="3.0" fill="#03323b"/><circle cx="105" cy="39" r="3.0" fill="#03323b"/>
  <!-- Elliptical mint orbit restored beneath the player, not a leaf. -->
  <path d="M29 91C14 94 12 102 24 106C43 114 93 105 110 91C123 81 116 74 106 74" fill="none" stroke="url(#flow)" stroke-width="6.1" stroke-linecap="round"/>
</svg>
